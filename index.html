<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, interactive-widget=resizes-content, viewport-fit=cover">
<title>Lumi by Deris</title>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--bg:#05070d;--line:rgba(255,255,255,.07);--text:#f5f6ff;--muted:#8c95b0;--accent:#fb7185;--accent2:#e11d48}
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--text);font-family:Geist,sans-serif;overscroll-behavior:none}
body{display:flex;justify-content:center;background:radial-gradient(140% 90% at 50% -20%, color-mix(in srgb, var(--accent) 20%, #1a1f3d) 0%, #0e1120 25%, #05070d 60%)}
.app{width:100%;max-width:780px;height:100dvh;height:100svh;display:flex;flex-direction:column;overflow:hidden;background:linear-gradient(180deg, rgba(255,255,255,.03), rgba(255,255,255,.01));border-left:1px solid var(--line);border-right:1px solid var(--line);position:relative}
.topbar{height:72px;display:flex;align-items:center;justify-content:space-between;padding:0 22px;flex:none;backdrop-filter:blur(40px) saturate(180%);background:rgba(8,10,20,.65);border-bottom:1px solid var(--line);z-index:10}
.brand{display:flex;align-items:center;gap:14px}
.logo-wrap{width:42px;height:42px;border-radius:14px;background:linear-gradient(135deg, color-mix(in srgb, var(--accent) 15%, #1a1e38), #10122a);border:1px solid rgba(255,255,255,.08);display:grid;place-items:center}
.mini-orb{width:24px;height:24px;border-radius:50%;background:radial-gradient(circle at 30% 25%, #fff 0%, var(--accent) 45%, var(--accent2) 80%);box-shadow:0 0 12px var(--accent),0 0 24px color-mix(in srgb,var(--accent) 50%, transparent);animation:miniBreathe 3s ease-in-out infinite}
.brand-name{font-weight:600;font-size:15px}
.brand-sub{font-size:11px;color:var(--muted);font-family:Geist Mono,monospace;display:flex;align-items:center;gap:6px;margin-top:2px}
.dot{width:6px;height:6px;border-radius:50%;background:#22c55e;box-shadow:0 0 10px #22c55e;animation:pulse 3s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.6}}
.icon-btn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.04);color:#d0d6ec;display:grid;place-items:center;cursor:pointer}
.chat{flex:1;overflow-y:auto;overflow-x:hidden;padding:14px 12px 100px 12px;scrollbar-width:none;position:relative;overscroll-behavior:contain;display:flex;flex-direction:column;-webkit-overflow-scrolling:touch}
.chat::-webkit-scrollbar{display:none}
.hero{min-height:58vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:18px;padding:0 10px;flex-shrink:0}
.core{width:140px;height:140px;position:relative}
.core-glow{position:absolute;inset:-20px;border-radius:50%;background:radial-gradient(circle, color-mix(in srgb, var(--accent) 25%, transparent) 0%, transparent 70%);filter:blur(30px);animation:coreGlowPulse 4s ease-in-out infinite}
.orb{position:absolute;inset:20px;border-radius:50%;background:radial-gradient(circle at 32% 28%, #ffffff 0%, var(--accent) 35%, var(--accent2) 65%, #1a1033 88%);box-shadow:0 0 0 1px rgba(255,255,255,.12) inset, 0 20px 60px color-mix(in srgb, var(--accent) 50%, transparent), 0 0 80px color-mix(in srgb,var(--accent) 35%, transparent);animation:orbFloat 8s ease-in-out infinite, orbGlow 4s ease-in-out infinite}
@keyframes orbFloat{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-8px) scale(1.02)}}
@keyframes orbGlow{0%,100%{box-shadow:0 0 0 1px rgba(255,255,255,.12) inset, 0 20px 60px color-mix(in srgb, var(--accent) 50%, transparent), 0 0 40px color-mix(in srgb,var(--accent) 30%, transparent); filter:brightness(1)}50%{box-shadow:0 0 0 1px rgba(255,255,255,.20) inset, 0 30px 80px color-mix(in srgb, var(--accent) 65%, transparent), 0 0 90px color-mix(in srgb,var(--accent) 55%, transparent); filter:brightness(1.15)}}
@keyframes miniBreathe{0%,100%{transform:scale(1); box-shadow:0 0 12px var(--accent), 0 0 24px color-mix(in srgb,var(--accent) 50%, transparent)}50%{transform:scale(1.08); box-shadow:0 0 18px var(--accent), 0 0 36px color-mix(in srgb,var(--accent) 70%, transparent)}}
@keyframes coreGlowPulse{0%,100%{opacity:.7; transform:scale(1)}50%{opacity:1; transform:scale(1.15)}}
.hero h1{font-size:32px;font-weight:600;line-height:.95;background:linear-gradient(180deg, #fff 20%, #a8b4d0 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin:0}
.hero p{max-width:320px;color:var(--muted);font-size:13px;margin:0}
.suggestions{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:560px;margin-top:6px}
.sugg{padding:8px 12px;border-radius:100px;background:rgba(255,255,255,.06);border:1px solid var(--line);font-size:11.5px;color:#d0d6ea;cursor:pointer;flex-shrink:0}
.message{position:relative;display:flex;gap:8px;margin:10px 0;width:100%;touch-action:pan-y;flex-shrink:0;align-items:flex-start!important}
.message.user{justify-content:flex-end;align-items:flex-start!important}
.message.lumi{justify-content:flex-start;align-items:flex-start!important}
.avatar{width:32px;height:32px;min-width:32px;min-height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;flex:none;align-self:flex-start!important;margin-top:2px!important}
.lumi-avatar{background:linear-gradient(135deg, color-mix(in srgb, var(--accent) 15%, #1e233f), #15182e);border:1px solid rgba(255,255,255,.10)}
.lumi-avatar-inner{width:16px;height:16px;border-radius:50%;background:radial-gradient(circle at 30% 25%, #fff 0%, var(--accent) 60%, var(--accent2) 90%);box-shadow:0 0 10px var(--accent);display:block;animation:miniBreathe 2.5s ease-in-out infinite}
.user-avatar{background:linear-gradient(135deg, #2a2d4a, #1e203a);color:#a8b0d0;border:1px solid rgba(255,255,255,.10)}
.bubble{width:fit-content;max-width:min(88%, 520px);padding:10px 14px 6px 14px;border-radius:22px;font-size:14.5px;line-height:1.55;word-break:break-word;white-space:pre-wrap;position:relative;display:flex;flex-direction:column;flex-shrink:0}
.lumi-bubble{background:linear-gradient(135deg, color-mix(in srgb, var(--accent) 10%, rgba(30,35,65,.85)), rgba(20,24,45,.85));border:1px solid rgba(255,255,255,.08);border-top-left-radius:8px}
.user-bubble{background:linear-gradient(135deg, var(--accent) 0%, var(--accent2) 100%);border-top-right-radius:8px;color:white}
.bubble-text{display:block;min-width:0}
.bubble-time{font-size:10px;font-family:Geist Mono,monospace;opacity:.65;letter-spacing:0.2px;margin-top:5px;align-self:flex-end;line-height:1;white-space:nowrap}
.quote-box{font-size:11.5px;line-height:1.25;padding:6px 8px 6px 10px;margin:0 0 7px 0;border-radius:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;border-left:3px solid}
.quote-box.lumi-quote{background:rgba(30,35,65,.9);border-left-color:var(--accent);color:#a8b4d0}
.quote-box.user-quote{background:rgba(255,255,255,.12);border-left-color:#fff;color:#fff}
.code-wrap{margin:10px 0 6px 0;border-radius:12px;overflow:hidden;background:#0a0f1e;border:1px solid rgba(255,255,255,.12);width:100%;max-width:100%}
.code-head{display:flex;justify-content:space-between;align-items:center;padding:9px 12px;background:rgba(255,255,255,.06);border-bottom:1px solid rgba(255,255,255,.08);font-family:Geist Mono,monospace;font-size:11px;color:#a8b4d0}
.copy-btn{padding:5px 10px;border-radius:8px;background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.10);color:#fff;font-size:11px;cursor:pointer}
.code-block{margin:0;padding:12px;font-family:Geist Mono,monospace;font-size:12px;line-height:1.6;white-space:pre-wrap;word-break:break-word;background:#0a0f1e;max-height:360px;overflow-y:auto}
.composer-wrap{flex:none;padding:10px 10px max(10px,env(safe-area-inset-bottom));background:rgba(8,10,20,.92);backdrop-filter:blur(30px);border-top:1px solid var(--line);z-index:9998;position:sticky;bottom:0;width:100%}
.reply-preview{display:none;background:rgba(22,26,45,.96);border-left:3px solid var(--accent);padding:7px 10px;border-radius:10px;margin-bottom:8px;font-size:12px;color:#d0d6ec;justify-content:space-between;align-items:center}
.reply-preview.show{display:flex}
.composer{display:flex;align-items:flex-end;gap:8px;padding:7px 7px 7px 14px;border-radius:26px;background:rgba(16,20,38,.95);border:1px solid rgba(255,255,255,.09)}
textarea{flex:1;min-height:24px;max-height:120px;resize:none;border:0;outline:0;background:transparent;color:#fff;font-size:15px;line-height:1.5;padding:10px 4px;font-family:Geist,sans-serif}
.plus,.mic,.send{width:42px;height:42px;border-radius:14px;border:1px solid rgba(255,255,255,.08);cursor:pointer;flex:none;display:grid;place-items:center}
.plus,.mic{background:rgba(255,255,255,.06);color:#a8b0c8}
.mic.listening{background:linear-gradient(135deg, var(--accent), var(--accent2));color:#fff;animation:micP 1.2s infinite}
@keyframes micP{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.send{background:linear-gradient(135deg, var(--accent) 0%, var(--accent2) 100%);color:#fff;border:0}
.thinking{display:flex;gap:4px;align-items:center;height:18px;padding:4px}
.thinking-dot{width:6px;height:6px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));animation:thinkOrb 1.4s infinite}
@keyframes thinkOrb{0%,100%{opacity:.4}50%{opacity:1}}
.scroll-down{position:absolute;right:16px;bottom:92px;width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));display:none;place-items:center;z-index:9997;cursor:pointer}
.scroll-down.show{display:grid}
.voice-stage{display:none;position:absolute;bottom:110px;left:50%;transform:translateX(-50%);z-index:9999}.voice-stage.show{display:flex}
.voice-big-orb{width:150px;height:150px;position:relative;display:grid;place-items:center}
.voice-big-core{width:110px;height:110px;border-radius:50%;background:radial-gradient(circle at 32% 28%, #ffffff 0%, var(--accent) 35%, var(--accent2) 65%, #1a1033 88%);box-shadow:0 0 0 1px rgba(255,255,255,.15) inset, 0 0 40px var(--accent), 0 0 80px color-mix(in srgb,var(--accent) 40%, transparent);animation:orbFloat 4s ease-in-out infinite, orbGlow 3s ease-in-out infinite}
.google-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.google-card{position:relative;border-radius:14px;overflow:hidden;background:#0e1120;border:1px solid rgba(255,255,255,.08)}
.google-card img{width:100%;height:190px;object-fit:cover;display:block}
.save-btn{position:absolute;bottom:6px;right:6px;padding:6px 10px;border-radius:100px;background:rgba(0,0,0,.7);color:#fff;font-size:11px;cursor:pointer}
.res-tag{position:absolute;top:6px;left:6px;padding:3px 6px;border-radius:6px;background:rgba(251,113,133,.9);color:#fff;font-size:9px;font-weight:700}
#floatingOrbWrap{display:none;position:fixed;inset:0;z-index:999999;pointer-events:none;background:transparent!important}#floatingOrbWrap.show{display:block;pointer-events:auto;background:transparent!important}
#floatingOrb{position:absolute;left:50%;top:50%;width:96px;height:96px;border-radius:50%;pointer-events:auto;background:radial-gradient(circle at 32% 28%, #fff 0%, var(--accent) 35%, var(--accent2) 65%, #1a1033 88%);box-shadow:0 0 0 1px rgba(255,255,255,.15) inset, 0 0 30px var(--accent), 0 0 60px color-mix(in srgb,var(--accent) 45%, transparent);animation:orbFloat 5s ease-in-out infinite, orbGlow 3.5s ease-in-out infinite;touch-action:none}
#floatingOrbStatus{position:absolute;top:112%;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.72);padding:6px 12px;border-radius:100px;font-size:11px;color:#fff;white-space:nowrap;backdrop-filter:blur(10px)}
.overlay-mode.topbar,.overlay-mode.hero,.overlay-mode #chat,.overlay-mode.composer-wrap,.overlay-mode.scroll-down,.overlay-mode #voiceStage{display:none!important}
.overlay-mode #floatingOrbWrap{background:rgba(5,7,13,.65)!important}
.overlay-mode #floatingOrbWrap.png-mode{background:transparent!important}
.mini-orb.speaking{animation:orbPulse 0.6s infinite, miniBreathe 1s infinite;box-shadow:0 0 22px var(--accent),0 0 40px var(--accent2)}
.orb.speaking{animation:orbFloat 2s ease-in-out infinite, orbPulse 0.8s infinite}
.voice-big-core.speaking{animation:orbPulse 0.6s infinite}
#floatingOrb.speaking{animation:orbPulse 0.6s infinite}
@keyframes orbPulse{0%{transform:scale(1);filter:brightness(1)}50%{transform:scale(1.12);filter:brightness(1.3)}100%{transform:scale(1)}}
</style>
</head>
<body>
<div class="app">
<header class="topbar"><div class="brand"><div class="logo-wrap"><div class="mini-orb"></div></div><div><div class="brand-name" id="brandName">Lumi</div><div class="brand-sub"><span class="dot"></span> By Deris • Live</div></div></div><button class="icon-btn" onclick="location.href='setting.html'">☰</button></header>
<main class="chat" id="chat"><section class="hero" id="hero"><div class="core"><div class="core-glow"></div><div class="orb"></div></div><h1>How can I help<br>you today?</h1><p>Serious intelligence by Deris.</p><div class="suggestions"><div class="sugg" onclick="suggest('Explain quantum computing simply')">✧ Explain quantum</div><div class="sugg" onclick="suggest('Write a professional email')">📧 Professional email</div><div class="sugg" onclick="suggest('Help me code a website')">💻 Code a website</div><div class="sugg" onclick="suggest('google>> Wizkid 4k')">📸 Google images</div><div class="sugg" onclick="suggest('open youtube')">📱 Open YouTube</div><div class="sugg" onclick="suggest('set alarm 6:30')">⏰ Set alarm</div><div class="sugg" onclick="suggest('flashlight on')">🔦 Torch on</div></div></section></main>
<div id="scrollBtn" class="scroll-down" onclick="chat.scrollTo({top:chat.scrollHeight,behavior:'smooth'})">↓</div>
<div id="voiceStage" class="voice-stage"><div class="voice-big-orb"><div class="voice-big-core"></div></div></div>
<div class="composer-wrap" id="composerWrap"><div id="replyPreview" class="reply-preview"><div style="overflow:hidden"><div style="font-size:10px;color:var(--accent);font-weight:600">REPLYING TO</div><div id="replyText"></div></div><span onclick="clearReply()" style="cursor:pointer;padding:4px 8px">✕</span></div><div class="composer"><button class="plus" onclick="clearMem()">+</button><textarea id="input" rows="1" placeholder="Ask Lumi anything..." oninput="autoGrow(this)" onkeydown="handleKey(event)" onfocus="onInputFocus()"></textarea><button class="mic" id="micBtn" onclick="toggleVoice()">🎤</button><button class="send" onclick="sendMessage()">➤</button></div></div>
<div id="floatingOrbWrap"><div id="floatingOrb"><div id="floatingOrbStatus">Yes sir? Listening...</div></div></div>
</div>
<script>
window.LumiPiper={
  speak: (text)=>{
    return new Promise(res=>{
      const synth=window.speechSynthesis;
      if(synth.speaking) synth.cancel();
      try{
        const s=JSON.parse(localStorage.getItem("lumi_ultimate_settings")||"{}");
        const voices=synth.getVoices();
        const clean=String(text).replace(/<[^>]*>/g," ").replace(/```[\s\S]*?```/g," ").slice(0,800);
        if(!clean.trim()){res();return;}
        const u=new SpeechSynthesisUtterance(clean);
        u.rate=parseFloat(s.tts_rate||"1"); u.pitch=parseFloat(s.tts_pitch||"0.8"); u.volume=parseFloat(s.tts_volume||"1");
        const idx=parseInt(s.chrome_voice)||0; if(voices[idx]) u.voice=voices[idx];
        document.querySelectorAll(".mini-orb,.orb,.voice-big-core,#floatingOrb").forEach(el=>el.classList.add("speaking"));
        u.onend=()=>{document.querySelectorAll(".mini-orb,.orb,.voice-big-core,#floatingOrb").forEach(el=>el.classList.remove("speaking"));res();};
        u.onerror=()=>{document.querySelectorAll(".mini-orb,.orb,.voice-big-core,#floatingOrb").forEach(el=>el.classList.remove("speaking"));res();};
        synth.speak(u);
      }catch{res()}
    });
  },
  stop: ()=>{try{window.speechSynthesis.cancel();document.querySelectorAll(".mini-orb,.orb,.voice-big-core,#floatingOrb").forEach(el=>el.classList.remove("speaking"));}catch{}}
};
window.speakLumi=window.LumiPiper.speak;
</script>
<script>
const chat=document.getElementById("chat"),input=document.getElementById("input"),hero=document.getElementById("hero"),scrollBtn=document.getElementById("scrollBtn"),composerWrap=document.getElementById("composerWrap");
let conversations=JSON.parse(localStorage.getItem("lumi_conversations")||"[]");
let recognition=null,finalTranscript="",isListening=false,replyTo=null,replyToType=null;
const SERPER_KEY="YOUR_SERPER_KEY";const isNativeApp=typeof Android!=='undefined';const urlParams=new URLSearchParams(window.location.search);const isOverlayMode=urlParams.get("overlay")==="true"||urlParams.get("mode")==="overlay";
function getSettings(){try{return JSON.parse(localStorage.getItem("lumi_ultimate_settings")||"{}")}catch{return{}}}
function getKey(){const s=getSettings();return (localStorage.getItem("groq_key")||s.groq_key||"").trim()}
function save(){const s=getSettings();if(s.save_history===false)return;localStorage.setItem("lumi_conversations",JSON.stringify(conversations.slice(-1000)))}
function nowTime(){return new Date().toLocaleTimeString('en-NG',{hour:'2-digit',minute:'2-digit',hour12:true}).toLowerCase()}
function scrollB(force=false){const nearBottom=chat.scrollHeight-chat.scrollTop-chat.clientHeight<300;if(nearBottom||force){requestAnimationFrame(()=>chat.scrollTo({top:chat.scrollHeight,behavior:"smooth"}))}checkScrollBtn()}
function autoGrow(el){el.style.height="auto";el.style.height=Math.min(el.scrollHeight,120)+"px";scrollB(false)}
function onInputFocus(){setTimeout(()=>chat.scrollTo({top:chat.scrollHeight,behavior:'smooth'}),300)}
function applySettings(){const s=getSettings();const map={indigo:["#7c8cff","#a88cff"],emerald:["#34d399","#10b981"],rose:["#fb7185","#e11d48"],amber:["#fbbf24","#f59e0b"],cyan:["#22d3ee","#06b6d4"],white:["#ffffff","#a8b4d0"]};const c=map[s.accent]||map.rose;document.documentElement.style.setProperty('--accent',c[0]);document.documentElement.style.setProperty('--accent2',c[1]);const bn=document.getElementById("brandName");if(bn)bn.textContent=(s.user_name?"Lumi • "+s.user_name:"Lumi")}
function escapeHtml(str){return str.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
function copyCode(btn,id){const el=document.getElementById(id);navigator.clipboard.writeText(el.innerText).then(()=>{btn.textContent="Copied ✓";setTimeout(()=>{btn.textContent="Copy"},1200)})}
function highlightCode(code){let h=escapeHtml(code);h=h.replace(/(&lt;!DOCTYPE[\s\S]*?&gt;)/gi,'<span>$1</span>');h=h.replace(/(&lt;!--[\s\S]*?--&gt;)/g,'<span>$1</span>');return h}
function formatLumi(raw){const blocks=[];let t=raw;t=t.replace(/```(\w+)?\n?([\s\S]*?)```/g,(m,l,c)=>{const id="c_"+Math.random().toString(36).slice(2,7);blocks.push({id,lang:l||"html",code:c.trim()});return `__CODE_${blocks.length-1}__`});t=escapeHtml(t).replace(/\*\*(.*?)\*\*/g,'<b>$1</b>').replace(/\n/g,'<br>');blocks.forEach((b,i)=>{const hl=highlightCode(b.code);const html=`<div class="code-wrap"><div class="code-head"><div><b>${b.lang} code</b></div><button class="copy-btn" onclick="copyCode(this,'${b.id}')">Copy</button></div><pre class="code-block" id="${b.id}">${hl}</pre></div>`;t=t.replace(`__CODE_${i}__`,html)});return t}
function isMobile(){return /Android|iPhone|iPad/i.test(navigator.userAgent)||window.innerWidth<768}
function handleKey(e){if(e.key==='Enter'&&!isMobile()&&!e.shiftKey){e.preventDefault();sendMessage()}}
async function lumiSpeak(text){if(!text)return;const s=getSettings();if(s.auto_tts===false&&!isOverlayMode)return;let clean=String(text).replace(/<[^>]*>/g," ").replace(/```[\s\S]*?```/g," ").trim().slice(0,1000);if(!clean)return;try{if(window.LumiPiper?.speak){await window.LumiPiper.speak(clean);return}}catch{}}
function initRec(){if(isNativeApp){stopWebWake();}const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){alert("Mic needs Chrome");return null}const rec=new SR();rec.continuous=false;rec.interimResults=true;rec.maxAlternatives=1;rec.lang=getSettings().voice_lang||'en-US';rec.onstart=()=>{isListening=true;finalTranscript=input.value.trim();if(!isOverlayMode){document.getElementById("micBtn").classList.add("listening")}};rec.onresult=(e)=>{let interim="",finalT="";for(let i=e.resultIndex;i<e.results.length;i++){const txt=e.results[i][0].transcript;if(e.results[i].isFinal)finalT+=txt+" ";else interim+=txt}if(isOverlayMode||document.getElementById("floatingOrbWrap").classList.contains("show")){document.getElementById("floatingOrbStatus").textContent=finalT||interim||"Listening...";if(finalT.trim()){handleOverlayVoiceResult(finalT.trim());}}else{input.value=(finalTranscript+" "+finalT+" "+interim).trim();autoGrow(input);if(finalT.trim())finalTranscript=(finalTranscript+" "+finalT).trim()}};rec.onend=()=>{if(isListening&&!isOverlayMode &&!document.getElementById("floatingOrbWrap").classList.contains("show")){try{rec.start()}catch{}}};rec.onerror=(e)=>{if(e.error==='not-allowed'){alert("Allow mic");stopVoice()}};return rec}
function stopUI(){document.getElementById("micBtn").classList.remove("listening")}

if(reply.includes("google-grid")){const row=document.createElement("div");row.className="message lumi";row.innerHTML=`<div class="avatar lumi-avatar"><span class="lumi-avatar-inner"></span></div><div class="bubble lumi-bubble"><span class="bubble-text">${reply}</span><span class="bubble-time">${nowTime()}</span></div>`;chat.appendChild(row);scrollB(true);conversations.push({text:reply,type:"lumi",time:nowTime()});save();attachSwipe(row,reply,"lumi")}else{addUI(reply,"lumi",null,true,nowTime())}
}
if(window.visualViewport &&!isNativeApp){window.visualViewport.addEventListener('resize',()=>{const vv=window.visualViewport,keyboardHeight=window.innerHeight-vv.height;if(keyboardHeight>100){composerWrap.style.transform=`translateY(-${keyboardHeight}px)`;chat.style.paddingBottom=(keyboardHeight+100)+'px';setTimeout(()=>chat.scrollTo({top:chat.scrollHeight,behavior:'smooth'}),100)}else{composerWrap.style.transform='translateY(0)';chat.style.paddingBottom='100px'}})}
let wakeRec=null; let isWakeListening=false;
function startWebWake(){
  const set=getSettings(); if(!set.wake_enabled) return; if(isNativeApp) return;
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition; if(!SR) return; if(isWakeListening) return;
  try{
    wakeRec=new SR(); wakeRec.continuous=true; wakeRec.interimResults=true; wakeRec.lang='en-US';
    wakeRec.onresult=(e)=>{
      let txt=""; for(let i=e.resultIndex;i<e.results.length;i++) txt+=e.results[i][0].transcript+" ";
      txt=txt.toLowerCase();
      const words=(getSettings().wake_words||"hey lumi").split(",").map(w=>w.trim().toLowerCase()).filter(Boolean);
      for(const w of words){ if(txt.includes(w)){ if(window.onWakeWordDetected) window.onWakeWordDetected(); break; } }
    };
    wakeRec.onend=()=>{ if(getSettings().wake_enabled){ setTimeout(()=>{try{wakeRec.start()}catch{}},800);} };
    wakeRec.start(); isWakeListening=true;
  }catch(e){}
}
function stopWebWake(){ if(wakeRec){try{wakeRec.stop()}catch{} isWakeListening=false;}}
function load(){applySettings();requestAllPermissions();if(isOverlayMode){document.body.classList.add("overlay-mode");document.documentElement.classList.add("overlay-mode");document.getElementById("floatingOrbWrap").classList.add("show");setupDraggableOrb();resetInactivityTimer()}if(conversations.length&&!isOverlayMode){hero.style.display="none";conversations.forEach(c=>{const isGrid=c.text.includes("google-grid");if(isGrid){const row=document.createElement("div");row.className="message "+c.type;row.innerHTML=c.type==="lumi"?`<div class="avatar lumi-avatar"><span class="lumi-avatar-inner"></span></div><div class="bubble lumi-bubble"><span class="bubble-text">${c.text}</span><span class="bubble-time">${c.time||nowTime()}</span></div>`:`<div class="bubble user-bubble"><span class="bubble-text">${escapeHtml(c.text)}</span><span class="bubble-time">${c.time||nowTime()}</span></div><div class="avatar user-avatar">YOU</div>`;chat.appendChild(row);attachSwipe(row,c.text,c.type)}else{addUI(c.text,c.type,c.reply||null,false,c.time||nowTime(),c.replyType||null)}})}const params=new URLSearchParams(window.location.search);if(params.get("wake")==="true"||localStorage.getItem("lumi_wake_trigger")==="1"){localStorage.removeItem("lumi_wake_trigger");setTimeout(()=>{if(window.onWakeWordDetected)window.onWakeWordDetected()},600)} setTimeout(startWebWake,1500);}
function suggest(t){input.value=t;autoGrow(input);sendMessage()}
function clearMem(){if(confirm("Clear?")){localStorage.removeItem("lumi_conversations");location.reload()}}
window.saveToDevice=async function(url,name){try{if(isNativeApp&&Android.saveImage){Android.saveImage(url,name);if(!isOverlayMode)addUI(`✅ Saving ${name} to gallery...`, "lumi", null, false);return}const res=await fetch(url);const blob=await res.blob();const blobUrl=URL.createObjectURL(blob);const a=document.createElement("a");a.href=blobUrl;a.download=name.replace(/[^a-z0-9]/gi,"_")+"_1080p.jpg";document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(blobUrl),2000)}catch(e){window.open(url,"_blank")}}
window.onVoiceResult=function(text){if(!text)return; showPngOrb("Heard: "+text.slice(0,30)); handleOverlayVoiceResult(text); }
load();
</script>
