<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; connect-src https://api.groq.com; img-src 'self' data: blob:; object-src 'none'; base-uri 'self'; form-action 'self'">

<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, interactive-widget=resizes-content, viewport-fit=cover">
<meta name="theme-color" content="#080a14">
<meta name="author" content="Derisdecloner_x4">
<title>Lumi — Text AI by Derisdecloner_x4</title>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
.reduce-motion *, .reduce-motion *:before, .reduce-motion *:after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important;transition-duration:.01ms!important}
.hide-message-times .bubble-time{display:none!important}
:root{--bg:#05070d;--line:rgba(255,255,255,.07);--text:#f5f6ff;--muted:#8c95b0;--accent:#fb7185;--accent2:#e11d48;--chat-font:Geist,sans-serif;--chat-size:14.5px;--chat-line:1.55;--bubble-max:88%}
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--text);font-family:Geist,sans-serif;overscroll-behavior:none}
body{display:flex;justify-content:center;background:radial-gradient(140% 90% at 50% -20%, color-mix(in srgb, var(--accent) 20%, #1a1f3d) 0%, #0e1120 25%, #05070d 60%)}
.app{width:100%;max-width:780px;height:100dvh;height:100svh;display:flex;flex-direction:column;overflow:hidden;background:linear-gradient(180deg, rgba(255,255,255,.03), rgba(255,255,255,.01));border-left:1px solid var(--line);border-right:1px solid var(--line);position:relative}
.topbar{height:72px;display:flex;align-items:center;justify-content:space-between;padding:0 22px;flex:none;backdrop-filter:blur(9px) saturate(120%);background:rgba(8,10,20,.65);border-bottom:1px solid var(--line);z-index:10}
.brand{display:flex;align-items:center;gap:14px}
.logo-wrap{width:42px;height:42px;border-radius:14px;background:linear-gradient(135deg, color-mix(in srgb, var(--accent) 15%, #1a1e38), #10122a);border:1px solid rgba(255,255,255,.08);display:grid;place-items:center}
.logo-letter{display:none}
.brand-name{font-weight:600;font-size:15px}
.brand-sub{font-size:11px;color:var(--muted);font-family:Geist Mono,monospace;display:flex;align-items:center;gap:6px;margin-top:2px}
.dot{width:6px;height:6px;border-radius:50%;background:#22c55e;box-shadow:0 0 10px #22c55e;animation:pulse 3s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.6}}
.icon-btn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.04);color:#d0d6ec;display:grid;place-items:center;cursor:pointer}
.chat{flex:1;overflow-y:auto;overflow-x:hidden;padding:14px 12px 100px 12px;scrollbar-width:none;position:relative;overscroll-behavior:contain;overflow-anchor:auto;display:flex;flex-direction:column;-webkit-overflow-scrolling:touch;touch-action:pan-y;pointer-events:auto;z-index:1}
.chat::-webkit-scrollbar{display:none}
.suggestions{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:560px;margin-top:6px}
.sugg{padding:8px 12px;border-radius:100px;background:rgba(255,255,255,.06);border:1px solid var(--line);font-size:11.5px;color:#d0d6ea;cursor:pointer;flex-shrink:0}
.message{position:relative;display:flex;gap:8px;margin:10px 0;width:100%;touch-action:pan-y;flex-shrink:0;align-items:flex-start!important}
.message.user{justify-content:flex-end;align-items:flex-start!important}
.message.lumi{justify-content:flex-start;align-items:flex-start!important}
.avatar{width:32px;height:32px;min-width:32px;min-height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;flex:none;align-self:flex-start!important;margin-top:2px!important}
.lumi-avatar{background:linear-gradient(135deg, color-mix(in srgb, var(--accent) 15%, #1e233f), #15182e);border:1px solid rgba(255,255,255,.10)}
.lumi-avatar{padding:0;overflow:hidden;background:rgba(10,13,27,.92)}
.avatar-orb{display:block;width:21px;height:21px;flex:none;border-radius:50%;background:radial-gradient(circle at 30% 25%,#fff 0%,var(--accent) 38%,var(--accent2) 76%,#1a1033 100%);box-shadow:0 0 8px color-mix(in srgb,var(--accent) 70%,transparent),0 0 15px color-mix(in srgb,var(--accent) 35%,transparent);animation:miniBreathe 3s ease-in-out infinite}
.user-avatar{background:linear-gradient(135deg, #2a2d4a, #1e203a);color:#a8b0d0;border:1px solid rgba(255,255,255,.10)}
.bubble{width:fit-content;max-width:min(var(--bubble-max), 560px);padding:10px 14px 6px 14px;border-radius:22px;font-family:var(--chat-font);font-size:var(--chat-size);line-height:var(--chat-line);word-break:break-word;white-space:pre-wrap;position:relative;display:flex;flex-direction:column;flex-shrink:0}
.lumi-bubble{background:linear-gradient(135deg, color-mix(in srgb, var(--accent) 10%, rgba(30,35,65,.85)), rgba(20,24,45,.85));border:1px solid rgba(255,255,255,.08);border-top-left-radius:8px}
.user-bubble{background:linear-gradient(135deg, var(--accent) 0%, var(--accent2) 100%);border-top-right-radius:8px;color:white}
.bubble-text{display:block;min-width:0}
.bubble-time{font-size:10px;font-family:Geist Mono,monospace;opacity:.65;letter-spacing:0.2px;margin-top:5px;align-self:flex-end;line-height:1;white-space:nowrap}
.quote-box{font-size:11.5px;line-height:1.25;padding:6px 8px 6px 10px;margin:0 0 7px 0;border-radius:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;border-left:3px solid}
.quote-box.lumi-quote{background:rgba(30,35,65,.9);border-left-color:var(--accent);color:#a8b4d0}
.quote-box.user-quote{background:rgba(255,255,255,.12);border-left-color:#fff;color:#fff}
.code-wrap{margin:10px 0 6px 0;border-radius:14px;overflow:hidden;background:#080d19;border:1px solid rgba(255,255,255,.14);width:100%;max-width:100%;box-shadow:0 8px 24px rgba(0,0,0,.18)}
.code-wrap.user-code{border-color:rgba(255,255,255,.2);background:#080d19}
.code-wrap.user-code .code-head{background:rgba(255,255,255,.07)}
.code-label{display:flex;align-items:center;gap:7px;text-transform:uppercase;letter-spacing:.06em}
.code-label:before{content:"▣";font-size:12px;color:var(--accent)}
.code-head{display:flex;justify-content:space-between;align-items:center;padding:9px 12px;background:rgba(255,255,255,.06);border-bottom:1px solid rgba(255,255,255,.08);font-family:Geist Mono,monospace;font-size:11px;color:#a8b4d0}
.copy-btn{padding:5px 10px;border-radius:8px;background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.10);color:#fff;font-size:11px;cursor:pointer}
.code-block{margin:0;padding:13px;font-family:Geist Mono,monospace;font-size:12px;line-height:1.65;white-space:pre;word-break:normal;overflow-x:auto;background:#080d19;max-height:420px;overflow-y:auto;tab-size:2}.tok-key{color:#c4a7ff}.tok-str{color:#a8e6a3}.tok-num{color:#f6c177}.tok-com{color:#7d8ba8;font-style:italic}.tok-tag{color:#7dd3fc}.code-foot{display:flex;justify-content:space-between;gap:8px;padding:6px 12px;border-top:1px solid rgba(255,255,255,.06);font-size:10px;color:#77839e;font-family:Geist Mono,monospace}
.code-actions{display:flex;gap:6px;align-items:center}
.view-btn{padding:5px 9px;border-radius:8px;background:rgba(251,113,133,.14);border:1px solid rgba(251,113,133,.22);color:#ffdbe2;font-size:11px;cursor:pointer}
.long-wrap{margin:9px 0 7px;padding:11px;border:1px solid rgba(255,255,255,.13);border-radius:15px;background:rgba(7,11,24,.72);width:100%;}
.long-wrap-head{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:11px;color:#cbd3eb;font-family:Geist Mono,monospace;margin-bottom:8px}
.long-preview{font-size:13px;line-height:1.55;color:#e1e5f5;white-space:pre-wrap;overflow-wrap:anywhere;max-height:145px;overflow:hidden;mask-image:linear-gradient(#000 72%,transparent)}
.long-wrap-foot{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:8px;color:#8490ac;font-size:10px}
.content-viewer{position:fixed;inset:0;z-index:10000000;background:rgba(2,4,12,.88);backdrop-filter:blur(7px);display:flex;align-items:stretch;justify-content:center;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.viewer-panel{width:100%;max-width:900px;min-height:0;display:flex;flex-direction:column;background:#090e1c;border:1px solid rgba(255,255,255,.12);box-shadow:0 24px 80px rgba(0,0,0,.55)}
.viewer-head{min-height:58px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 14px;background:rgba(255,255,255,.045);border-bottom:1px solid rgba(255,255,255,.09)}
.viewer-title{font-size:13px;font-weight:600;color:#f5f6ff;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.viewer-tools{display:flex;gap:7px;flex:none}
.viewer-tool{padding:8px 11px;border-radius:10px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.07);color:#fff;font-size:11px;cursor:pointer}
.viewer-body{flex:1;min-height:0;overflow:auto;padding:16px 14px 30px;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;color:#e5e9f7;line-height:1.65;overflow-wrap:anywhere}
.viewer-body .code-wrap{margin:0 0 14px}
.viewer-body .code-block{max-height:none;overflow:visible;white-space:pre;}
.viewer-body .long-wrap{display:none}
.viewer-rich{white-space:normal}
.viewer-rich .bubble-text,.viewer-rich .long-preview{white-space:pre-wrap}
@media(min-width:700px){.viewer-panel{margin:18px;border-radius:18px;overflow:hidden}.content-viewer{padding:0;align-items:center}}

.composer-wrap{flex:none;padding:10px 10px max(10px,env(safe-area-inset-bottom));background:rgba(8,10,20,.92);backdrop-filter:blur(8px);border-top:1px solid var(--line);z-index:9998;position:sticky;bottom:0;width:100%;pointer-events:auto}
.reply-preview{display:none;background:rgba(22,26,45,.96);border-left:3px solid var(--accent);padding:7px 10px;border-radius:10px;margin-bottom:8px;font-size:12px;color:#d0d6ec;justify-content:space-between;align-items:center}
.reply-preview.show{display:flex}
.composer{display:flex;align-items:flex-end;gap:8px;padding:7px 7px 7px 14px;border-radius:26px;background:rgba(16,20,38,.95);border:1px solid rgba(255,255,255,.09)}
textarea{flex:1;min-height:24px;max-height:120px;resize:none;border:0;outline:0;background:transparent;color:#fff;font-size:15px;line-height:1.5;padding:10px 4px;font-family:Geist,sans-serif}
.plus,.send{width:42px;height:42px;border-radius:14px;border:1px solid rgba(255,255,255,.08);cursor:pointer;flex:none;display:grid;place-items:center}
.plus{background:rgba(255,255,255,.06);color:#a8b0c8}
.send{background:linear-gradient(135deg, var(--accent) 0%, var(--accent2) 100%);color:#fff;border:0}
.thinking{display:flex;gap:4px;align-items:center;height:18px;padding:4px}
.thinking-dot{width:6px;height:6px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));animation:thinkOrb 1.4s infinite}
@keyframes thinkOrb{0%,100%{opacity:.4}50%{opacity:1}}
.scroll-down{position:absolute;right:16px;bottom:92px;width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));display:none;place-items:center;z-index:9997;cursor:pointer}
.scroll-down.show{display:grid}

.hero{min-height:58vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:16px;padding:24px 10px;flex-shrink:0}
.hero-mark{width:54px;height:54px;border-radius:18px;display:grid;place-items:center;background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 30%,#171a30),#101225);border:1px solid rgba(255,255,255,.12);font-weight:700;font-size:24px;box-shadow:0 12px 34px rgba(0,0,0,.22)}
.hero h1{font-size:30px;font-weight:600;line-height:1.08;background:linear-gradient(180deg,#fff 20%,#a8b4d0 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin:0}
.hero p{max-width:340px;color:var(--muted);font-size:13px;line-height:1.55;margin:0}

/* Restored original Lumi floating orb and voice interaction appearance */
@keyframes orbFloat{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-8px) scale(1.02)}}
@keyframes orbGlow{0%,100%{opacity:1}50%{opacity:.88}}
.mic{width:42px;height:42px;border-radius:14px;border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.06);color:#a8b0c8;display:grid;place-items:center;align-self:flex-end;flex:none;padding:0;cursor:pointer;box-sizing:border-box}
.mic svg{display:block;width:20px;height:20px;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;fill:none;pointer-events:none}
.mic.listening{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;animation:micP 1.2s infinite}
@keyframes micP{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
#floatingOrbWrap{display:none;position:fixed;inset:0;z-index:999999;pointer-events:none!important;background:transparent!important}
#floatingOrbWrap.show{display:block;pointer-events:none!important;background:transparent!important}
#floatingOrb{position:absolute;left:50%;top:50%;width:96px;height:96px;border-radius:50%;pointer-events:auto!important;background:radial-gradient(circle at 32% 28%,#fff 0%,var(--accent) 35%,var(--accent2) 65%,#1a1033 88%);box-shadow:0 0 0 1px rgba(255,255,255,.15) inset,0 0 30px var(--accent),0 0 60px color-mix(in srgb,var(--accent) 45%,transparent);animation:orbFloat 5s ease-in-out infinite,orbGlow 3.5s ease-in-out infinite;touch-action:none;cursor:grab}
#floatingOrbStatus{position:absolute;top:112%;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.72);padding:6px 12px;border-radius:100px;font-size:11px;color:#fff;white-space:nowrap;backdrop-filter:blur(5px);pointer-events:none!important}
@media(max-width:520px){#floatingOrb{width:96px;height:96px}}


/* Original Lumi identity orb retained in the home screen and brand mark */
.mini-orb{width:24px;height:24px;border-radius:50%;background:radial-gradient(circle at 30% 25%,#fff 0%,var(--accent) 45%,var(--accent2) 80%);box-shadow:0 0 12px var(--accent),0 0 24px color-mix(in srgb,var(--accent) 50%,transparent);animation:miniBreathe 3s ease-in-out infinite}
@keyframes miniBreathe{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
.core{width:140px;height:140px;position:relative}
.core-glow{position:absolute;inset:-20px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--accent) 25%,transparent) 0%,transparent 70%);filter:blur(12px);animation:coreGlowPulse 4s ease-in-out infinite}
.orb{position:absolute;inset:20px;border-radius:50%;background:radial-gradient(circle at 32% 28%,#fff 0%,var(--accent) 35%,var(--accent2) 65%,#1a1033 88%);box-shadow:0 0 0 1px rgba(255,255,255,.12) inset,0 20px 60px color-mix(in srgb,var(--accent) 50%,transparent),0 0 80px color-mix(in srgb,var(--accent) 35%,transparent);animation:orbFloat 8s ease-in-out infinite,orbGlow 4s ease-in-out infinite}
@keyframes coreGlowPulse{0%,100%{opacity:.7;transform:scale(1)}50%{opacity:1;transform:scale(1.15)}}

</style>
</head>
<body>
<div class="app">
<header class="topbar"><div class="brand"><div class="logo-wrap"><div class="mini-orb"></div></div><div><div class="brand-name" id="brandName">Lumi</div><div class="brand-sub"><span class="dot"></span> TEXT-ONLY AI • CREATED BY DERISDECLONER_X4</div></div></div><button class="icon-btn" aria-label="Open settings" onclick="location.href='setting.html'">☰</button></header>
<main class="chat" id="chat">
<section class="hero" id="hero">
<div class="core"><div class="core-glow"></div><div class="orb"></div></div>
<h1>What would you like<br>to explore?</h1>
<p>A text-based AI space for questions, ideas, writing, learning and building.</p>
<div class="suggestions">
<div class="sugg" onclick="suggest('Explain a difficult topic in simple words')">✧ Explain a topic</div>
<div class="sugg" onclick="suggest('Write a professional email for me')">📧 Write an email</div>
<div class="sugg" onclick="suggest('Help me build a website')">💻 Build a website</div>
<div class="sugg" onclick="suggest('Summarize these notes for me')">📝 Summarize notes</div>
<div class="sugg" onclick="suggest('Give me creative ideas for a project')">💡 Brainstorm ideas</div>
<div class="sugg" onclick="suggest('Translate this into clear English: ')">🌐 Translate text</div>
</div>
</section>
</main>
<div id="scrollBtn" class="scroll-down" onclick="chat.scrollTo({top:chat.scrollHeight,behavior:'smooth'})">↓</div>
<div class="composer-wrap" id="composerWrap">
<div id="replyPreview" class="reply-preview"><div style="overflow:hidden"><div style="font-size:10px;color:var(--accent);font-weight:600">REPLYING TO</div><div id="replyText"></div></div><span onclick="clearReply()" style="cursor:pointer;padding:4px 8px">✕</span></div>
<div class="composer"><button class="plus" aria-label="Clear chat history" title="Clear chat history" onclick="clearHistory()">＋</button><textarea id="input" rows="1" placeholder="Message Lumi..." oninput="autoGrow(this)" onkeydown="handleKey(event)" onfocus="onInputFocus()"></textarea><button class="mic" id="micBtn" aria-label="Voice input" title="Voice input" onclick="toggleVoice()"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="2.8" width="6" height="12" rx="3"></rect><path d="M5.5 11.5a6.5 6.5 0 0 0 13 0M12 18v3.2M8.5 21.2h7"></path></svg></button><button class="send" aria-label="Send message" onclick="sendMessage()">➤</button></div>
</div>
</div>
<div id="floatingOrbWrap"><div id="floatingOrb"><div id="floatingOrbStatus">Listening...</div></div></div>
<script src="reasoning-engine.js"></script>
<script>
const chat=document.getElementById("chat"),input=document.getElementById("input"),hero=document.getElementById("hero"),scrollBtn=document.getElementById("scrollBtn"),composerWrap=document.getElementById("composerWrap");
let conversations=[],replyTo=null,replyToType=null;
const DEFAULT_SETTINGS={
  user_name:"",user_avatar:"YOU",accent:"rose",talk_style:"professional",lang:"auto",
  reply_length:"normal",context_window:"8",use_emoji:true,save_history:true,custom_prompt:"",
  groq_key:"",key_storage_mode:"persistent",reasoning_level:"maximum",intelligence_profile:"auto",proactive_chat:true,
  response_format:"auto",verify_answers:true,clarify_when_needed:true,proactive_help:true,
  teach_mode:true,confidence_labels:true,memory_enabled:true,memory_notes:"",expert_coding:true,
  debug_depth:"forensic",code_standard:"production",preserve_existing:true,include_tests:true,
  security_review:true,explain_code:true,auto_code_format:true,complete_code:true,temperature_mode:"precise",conversation_mode:"natural",humor_level:"balanced",empathy_level:"warm",curiosity_level:"balanced",challenge_mode:"respectful",followup_style:"smart",example_frequency:"when_useful",refusal_detail:"explain",uncertainty_style:"honest",topic_depth:"adaptive",stt_timeout:"15",stt_continuous:false
};
function safeJson(raw,fallback){try{const v=JSON.parse(raw);return v??fallback}catch{return fallback}}
function getSettings(){
  let stored={};
  try{stored=safeJson(localStorage.getItem("lumi_ultimate_settings")||"{}",{});}catch{}
  if(!stored||typeof stored!=="object"||Array.isArray(stored))stored={};
  const clean={...DEFAULT_SETTINGS};
  Object.keys(DEFAULT_SETTINGS).forEach(k=>{if(stored[k]!==undefined)clean[k]=stored[k];});
  if(stored.groq_key===undefined){try{clean.groq_key=localStorage.getItem("groq_key")||"";}catch{}}
  return clean;
}
function getKey(){
  const settings=getSettings();
  try{
    if(settings.key_storage_mode==="session")return String(sessionStorage.getItem("lumi_groq_key")||"").trim();
    return String(localStorage.getItem("groq_key")||settings.groq_key||"").trim();
  }catch{return String(settings.groq_key||"").trim()}
}
function getSavedMemory(){try{const a=safeJson(localStorage.getItem("lumi_saved_memory")||"[]",[]);return Array.isArray(a)?a.filter(x=>typeof x==="string").slice(-100):[]}catch{return []}}
function saveSavedMemory(items){try{localStorage.setItem("lumi_saved_memory",JSON.stringify(items.slice(-100)));return true}catch{return false}}
function getLearnedPreferences(){try{const a=safeJson(localStorage.getItem("lumi_learned_preferences")||"[]",[]);return Array.isArray(a)?a.filter(x=>typeof x==="string").slice(-30):[]}catch{return []}}
function learnFromUser(message){
  if(getSettings().memory_enabled===false)return;
  const raw=String(message||"").trim();
  // Save only clear, non-sensitive communication/product preferences—not personal secrets or inferred traits.
  const match=raw.match(/^(?:from now on[, ]*|going forward[, ]*|please )?(?:i prefer|i like|i want you to|always|never|don't|do not|stop)\s+(.{5,180})$/i);
  if(!match)return;
  const note=match[0].replace(/\s+/g," ").trim();
  if(/password|passcode|api.?key|token|bank|card number|address|medical|diagnos|religion|politic|sexual/i.test(note))return;
  const items=getLearnedPreferences();
  if(!items.some(x=>x.toLowerCase()===note.toLowerCase())){items.push(note);try{localStorage.setItem("lumi_learned_preferences",JSON.stringify(items.slice(-30)))}catch{}}
}
function handleMemoryDirective(message,allowSave=true){
  const raw=String(message||"").trim();
  const forgetAll=/\b(forget|delete|clear)\b.{0,35}\b(all|everything|every memory|my memories)\b/i.test(raw);

    if(!modelFailed)lastError="The response could not be completed";
  }
  return "I’m having trouble connecting right now"+(lastError?" ("+lastError+").":".")+" Please try again in a moment.";
}
async function sendMessage(){
  if(window.sendBusy)return;
  const t=input.value.trim();if(!t)return;
  window.sendBusy=true;
  try{
    const currentReply=replyTo,currentReplyType=replyToType,sentTime=nowTime();
    addUI(t,"user",currentReply,true,sentTime,currentReplyType);
    learnFromUser(t);
    input.value="";autoGrow(input);clearReply();
    const typing=document.createElement("div");typing.id="typing";typing.className="message lumi";typing.innerHTML=`<div class="avatar lumi-avatar" aria-label="Lumi"><span class="avatar-orb"></span></div><div class="bubble lumi-bubble"><div class="thinking"><div class="thinking-dot"></div><div class="thinking-dot"></div></div></div>`;chat.appendChild(typing);scrollB(true);
    const memoryAction=handleMemoryDirective(t,getSettings().memory_enabled!==false);
    const query=currentReply?`Replying to "${currentReply}": ${t}`:t;
    const reply=await callLumi(query,memoryAction);
    document.getElementById("typing")?.remove();addUI(reply,"lumi",null,true,nowTime());
  }catch(e){document.getElementById("typing")?.remove();addUI("Something went wrong. Please try again.","lumi",null,true,nowTime())}
  finally{window.sendBusy=false}
}
let lumiIdleTimer=null,lumiLastActivity=Date.now(),lumiIdleNudgeSent=false;
function cancelNativeLumiNudge(){try{if(window.AndroidNotify&&typeof AndroidNotify.cancelBackgroundNudge==="function")AndroidNotify.cancelBackgroundNudge()}catch(e){}}
function makeBackgroundLumiNudge(){
  const settings=getSettings(),name=String(settings.user_name||"").trim();
  const lastUser=[...conversations].reverse().find(c=>c.type==="user"&&String(c.text||"").trim());
  const raw=lastUser?String(lastUser.text).replace(/\s+/g," ").trim():"";
  const topic=raw.length>72?raw.slice(0,69)+"...":raw;
  const lines=[
    topic?`I was still thinking about what you said: “${topic}” — how did that turn out?`:"A random thought crossed my mind and I wanted to share it with you. How's your day going?",
    topic?`You mentioned “${topic}” earlier. I have a feeling there's more to that story 😄`:"You went quiet on me for a bit 😭 Hope everything is going smoothly over there.",
    "I just thought of something interesting to ask you, but first — how are things going?",
    "Quick check-in: how has your day been treating you? Anything interesting happen?",
    "I was wondering what you've been up to. Got anything new going on?",
    topic?`That conversation about “${topic}” came back to mind. We should pick it up when you're free.`:"I have another topic we could explore whenever you're around.",
    "Not interrupting your day — just dropping a little hello and checking how you're doing.",
    "Well, it's been quiet here 😭 What have you been getting into?"
  ];
  let message=lines[Math.floor(Math.random()*lines.length)];
  if(name&&Math.random()<0.24)message=name+", "+message.charAt(0).toLowerCase()+message.slice(1);
  return message;
}
function scheduleNativeLumiNudge(){
  try{
    const settings=getSettings();
    if(settings.proactive_chat===false||!conversations.length||!window.AndroidNotify||typeof AndroidNotify.scheduleBackgroundNudge!=="function")return;
    const delay=2+Math.floor(Math.random()*9); // 2–10 minutes, handled by Android even while WebView is suspended.
    AndroidNotify.scheduleBackgroundNudge("Lumi",makeBackgroundLumiNudge(),delay);
  }catch(e){}
}
function resetLumiIdle(){lumiLastActivity=Date.now();lumiIdleNudgeSent=false;if(lumiIdleTimer)clearTimeout(lumiIdleTimer);cancelNativeLumiNudge();scheduleLumiInitiative()}
function scheduleLumiInitiative(){
  if(lumiIdleTimer)clearTimeout(lumiIdleTimer);
  if(getSettings().proactive_chat===false||lumiIdleNudgeSent)return;
  const wait=120000+Math.floor(Math.random()*480001); // Random 2–10 minute visible-chat check-in.
  lumiIdleTimer=setTimeout(async()=>{
    const quietFor=Date.now()-lumiLastActivity;
    const inputBusy=document.activeElement===input&&input.value.trim().length>0;
    if(document.visibilityState!=="visible"||window.sendBusy||inputBusy||!conversations.length||quietFor<119000){scheduleLumiInitiative();return;}
    lumiIdleNudgeSent=true;
    const settings=getSettings(),name=String(settings.user_name||"").trim();
    const recentTurns=settings.memory_enabled===false?"Conversation memory is disabled; use only the current moment and do not refer to earlier chats.":conversations.slice(-8).map(c=>`${c.type==="user"?"USER":"LUMI"}: ${String(c.text||"").slice(0,500)}`).join("\n");
    const prompt="Write one spontaneous, context-aware check-in to the user because the chat has been quiet for a random interval. Recent conversation:\n"+recentTurns+"\nUser's saved display name: "+(name||"not set")+"\nMake it sound natural and varied, not like a fixed notification. You may be playfully dramatic or curious, or pick up an unfinished topic. Sometimes use the display name if it fits, but not routinely. One or two short sentences only. Do not say this is automatic, guilt the user, or imply they owe you a reply.";
    const opener=await callLumi(prompt);
    if(document.visibilityState==="visible"&&!window.sendBusy&&opener&&!/^Lumi is not connected|^I’m having trouble connecting/i.test(opener)){addUI(opener,"lumi",null,true,nowTime());}
  },wait);
}
["pointerdown","keydown","touchstart","scroll"].forEach(ev=>document.addEventListener(ev,resetLumiIdle,{passive:true}));
document.addEventListener("visibilitychange",()=>{
  if(document.visibilityState==="visible"){
    cancelNativeLumiNudge();
    resetLumiIdle();
  }else{
    if(lumiIdleTimer)clearTimeout(lumiIdleTimer);
    scheduleNativeLumiNudge();
  }
});
resetLumiIdle();
if(window.visualViewport){window.visualViewport.addEventListener('resize',()=>{const vv=window.visualViewport,keyboardHeight=window.innerHeight-vv.height;if(keyboardHeight>100){composerWrap.style.transform=`translateY(-${keyboardHeight}px)`;chat.style.paddingBottom=(keyboardHeight+100)+'px';requestAnimationFrame(()=>{chat.scrollTop=chat.scrollHeight})}else{composerWrap.style.transform='translateY(0)';chat.style.paddingBottom='100px'}})}
function load(){applySettings();if(conversations.length){hero.style.display="none";conversations.forEach(c=>addUI(c.text,c.type,c.reply||null,false,c.time||nowTime(),c.replyType||null,false));requestAnimationFrame(()=>{chat.scrollTop=chat.scrollHeight;checkScrollBtn()});}}
function suggest(t){input.value=t;autoGrow(input);sendMessage()}
function clearHistory(){
  const old=document.getElementById("clearModal");if(old)old.remove();
  const modal=document.createElement("div");modal.id="clearModal";modal.style.cssText="position:fixed;inset:0;z-index:9999999;background:rgba(0,0,0,.75);backdrop-filter:blur(7px);display:grid;place-items:center;padding:20px";
  modal.innerHTML=`<div style="background:#12152a;border:1px solid rgba(255,255,255,.12);border-radius:22px;padding:22px;width:100%;max-width:320px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.6)"><div style="font-weight:600;font-size:15px;margin-bottom:8px">Clear all chats?</div><div style="font-size:12px;color:#8c95b0;margin-bottom:20px">This cannot be undone.</div><div style="display:flex;gap:10px"><button id="clearCancel" style="flex:1;padding:12px;border-radius:12px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.06);color:#fff;cursor:pointer">Cancel</button><button id="clearOk" style="flex:1;padding:12px;border-radius:12px;border:0;background:linear-gradient(135deg,#fb7185,#e11d48);color:#fff;font-weight:600;cursor:pointer">Clear</button></div></div>`;
  document.body.appendChild(modal);document.getElementById("clearCancel").onclick=()=>modal.remove();
  document.getElementById("clearOk").onclick=()=>{conversations=[];try{localStorage.removeItem("lumi_conversations")}catch{}modal.remove();location.reload()};
  modal.onclick=e=>{if(e.target===modal)modal.remove()};
}

/* Restored Lumi orb + live speech-to-text.
   Interim words are shown as the user speaks; a short silence sends the transcript. */
const isNativeApp=typeof Android!=="undefined";
const urlParams=new URLSearchParams(window.location.search);
const isOverlayMode=urlParams.get("overlay")==="true"||urlParams.get("mode")==="overlay";
let recognition=null,finalTranscript="",isListening=false,sttTimeoutTimer=null,sttSilenceTimer=null,voiceSendLocked=false;
function stopUI(){
  const mic=document.getElementById("micBtn");
  if(mic)mic.classList.remove("listening");
}
function showPngOrb(text){
  const wrap=document.getElementById("floatingOrbWrap");
  const status=document.getElementById("floatingOrbStatus");
  if(!wrap||!status)return;
  wrap.classList.add("show");
  if(!isOverlayMode)document.body.classList.remove("overlay-mode");
  status.textContent=text||"Listening...";
  setupDraggableOrb();
  resetInactivityTimer();
}
function hidePngOrb(){
  const wrap=document.getElementById("floatingOrbWrap");
  const orb=document.getElementById("floatingOrb");
  if(wrap)wrap.classList.remove("show");
  if(orb){orb.style.left="50%";orb.style.top="50%";orb.style.transform="translate(-50%,-50%)";}
}
function clearSTTTimers(){clearTimeout(sttTimeoutTimer);clearTimeout(sttSilenceTimer);}
function updateVoiceText(text){
  const value=String(text||"").trim();
  if(!value)return;
  input.value=value;
  autoGrow(input);
  const status=document.getElementById("floatingOrbStatus");
  if(status)status.textContent="Listening: "+value.slice(-55);
}
function finishVoiceAndSend(text){
  const value=String(text||input.value||"").trim();
  if(!value||voiceSendLocked)return;
  voiceSendLocked=true;
  clearSTTTimers();
  isListening=false;
  try{if(recognition)recognition.onend=null;}catch(e){}
  try{if(recognition)recognition.stop();}catch(e){}
  try{if(isNativeApp&&window.Android&&Android.stopVoice)Android.stopVoice();}catch(e){}
  stopUI();hidePngOrb();
  input.value=value;autoGrow(input);
  setTimeout(()=>{sendMessage();voiceSendLocked=false;},80);
}
function scheduleVoiceAutoSend(delay=1450){
  clearTimeout(sttSilenceTimer);
  sttSilenceTimer=setTimeout(()=>{
    if(!isListening)return;
    const text=(input.value||"").trim();
    if(text)finishVoiceAndSend(text);
  },delay);
}
function initRec(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR)return null;
  const r=new SR(),settings=getSettings();
  let langCode=settings.lang||"";
  if(!langCode||langCode==="auto"||langCode==="english")langCode=navigator.language||"en-US";
  r.lang=langCode;
  const continuous=settings.stt_continuous===true||String(settings.stt_timeout||"15").toLowerCase()==="continuous";
  r.continuous=continuous;
  r.interimResults=true;
  r.maxAlternatives=1;
  let lastCombined="";
  r.onresult=e=>{
    let finalParts="",interimParts="";
    for(let i=0;i<e.results.length;i++){
      const result=e.results[i],transcript=result&&result[0]?result[0].transcript:"";
      if(result.isFinal)finalParts+=transcript+" ";else interimParts+=transcript+" ";
    }
    const combined=(finalParts+interimParts).trim();
    if(!combined)return;
    lastCombined=combined;
    updateVoiceText(combined);
    // Send automatically after the speaker pauses, even when continuous mode is enabled.
    scheduleVoiceAutoSend(continuous?1700:1250);
  };
  r.onerror=e=>{
    // Some WebViews emit "no-speech" when the user pauses; don't discard captured words.
    const text=(input.value||lastCombined||"").trim();
    if(text){finishVoiceAndSend(text);return;}
    isListening=false;clearSTTTimers();stopUI();hidePngOrb();
    const reason=e&&e.error;
    if(reason&&reason!=="aborted"&&reason!=="no-speech")addUI("⚠️ Microphone error: "+reason+". Check microphone permission and try again.","lumi",null,true,nowTime());
  };
  r.onend=()=>{
    if(!isListening)return;
    const text=(input.value||lastCombined||"").trim();
    if(text)finishVoiceAndSend(text);
    else{isListening=false;clearSTTTimers();stopUI();hidePngOrb();}
  };
  return r;
}
function parseDurationToMs(value){
  const str=String(value||"15").toLowerCase().trim();
  if(str==="continuous")return 0;
  const match=str.match(/(\d+(\.\d+)?)/);
  let num=match?parseFloat(match[1]):15;
  if(str.includes("minute")||str.includes("min"))num*=60;
  if(str.includes("hour"))num*=3600;
  return Math.round(Math.max(1,Math.min(120,num))*1000);
}
async function toggleVoice(){
  if(isListening){stopVoice();return;}
  voiceSendLocked=false;clearSTTTimers();
  finalTranscript=input.value.trim();
  // Start a fresh dictated message rather than mixing old typed text into speech.
  input.value="";autoGrow(input);
  isListening=true;
  const settings=getSettings(),timeout=String(settings.stt_timeout||"15");
  showPngOrb("Listening... start speaking");
  const mic=document.getElementById("micBtn");if(mic)mic.classList.add("listening");
  if(isNativeApp&&window.Android&&typeof Android.startVoice==="function"){
    let nativeStarted=false;
    try{Android.startVoice();nativeStarted=true;}catch(e){nativeStarted=false;}
    if(nativeStarted){
      const ms=parseDurationToMs(timeout);
      if(ms)sttTimeoutTimer=setTimeout(()=>{
        const text=(input.value||"").trim();
        if(text)finishVoiceAndSend(text);else stopVoice();
      },ms);
      return;
    }
  }
  recognition=initRec();
  if(recognition){
    try{
      recognition.start();
      const ms=parseDurationToMs(timeout);
      if(ms)sttTimeoutTimer=setTimeout(()=>{
        const text=(input.value||"").trim();
        if(text)finishVoiceAndSend(text);else stopVoice();
      },ms);
      return;
    }catch(e){recognition=null;}
  }
  isListening=false;clearSTTTimers();stopUI();hidePngOrb();
  addUI("⚠️ Voice input is not available in this browser or device. Allow microphone access or use the Android voice input bridge.","lumi",null,true,nowTime());
}
function stopVoice(){
  clearSTTTimers();isListening=false;
  try{if(isNativeApp&&window.Android&&Android.stopVoice)Android.stopVoice();}catch(e){}
  if(recognition){try{recognition.onend=null;recognition.stop();}catch(e){}}
  stopUI();
  const orb=document.getElementById("floatingOrb");if(orb)orb.classList.remove("listening");
  const status=document.getElementById("floatingOrbStatus");if(status)status.textContent="Tap orb to speak";
  if(!isOverlayMode)setTimeout(()=>{if(!isListening)hidePngOrb();},500);
}
// Android/Sketchware voice bridge can call this for live partial speech results.
window.onVoicePartialResult=function(text){if(isListening&&text){updateVoiceText(text);scheduleVoiceAutoSend(1600);}};

let inactivityTimer=null;
function resetInactivityTimer(){
  clearTimeout(inactivityTimer);
  inactivityTimer=setTimeout(()=>{hidePngOrb();},15000);
}
function setupDraggableOrb(){
  const orb=document.getElementById("floatingOrb");
  if(!orb||orb.dataset.dragSetup)return;
  orb.dataset.dragSetup="1";
  let dragging=false,startX=0,startY=0,initialLeft=0,initialTop=0,moved=false;
  const clamp=(value,min,max)=>Math.min(Math.max(value,min),max);
  orb.addEventListener("touchstart",e=>{
    dragging=true;moved=false;startX=e.touches[0].clientX;startY=e.touches[0].clientY;
    const rect=orb.getBoundingClientRect();initialLeft=rect.left;initialTop=rect.top;
    orb.style.transition="none";resetInactivityTimer();
  },{passive:false});
  orb.addEventListener("touchmove",e=>{
    if(!dragging)return;e.preventDefault();
    const dx=e.touches[0].clientX-startX,dy=e.touches[0].clientY-startY;
    if(Math.abs(dx)>5||Math.abs(dy)>5)moved=true;
    orb.style.left=clamp(initialLeft+dx,0,window.innerWidth-96)+"px";
    orb.style.top=clamp(initialTop+dy,0,window.innerHeight-96)+"px";
    orb.style.transform="none";resetInactivityTimer();
  },{passive:false});
  orb.addEventListener("touchend",()=>{
    dragging=false;orb.style.transition="all .3s ease";
    if(!moved){if(isListening)stopVoice();else toggleVoice();}
    resetInactivityTimer();
  });
}
window.onVoiceResult=function(text){
  if(!text)return;
  updateVoiceText(text);
  finishVoiceAndSend(String(text).trim());
};

load();
</script>
